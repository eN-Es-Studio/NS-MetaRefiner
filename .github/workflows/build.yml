name: Build NS MetaRefiner to EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Ambil Kode dari Repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Semua Library Python
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter transformers torch torchvision piexif requests keyring cairosvg iptcinfo3 pymupdf mutagen opencv-python numpy pillow pywin32

    # === LANGKAH 1: AMBIL VERSI OTOMATIS ===
    - name: Ambil Versi dari Script Python
      id: get_version
      shell: powershell
      run: |
        # PERHATIAN: Pastikan nama file di bawah (metalensfinal.py) sesuai dengan nama file script utama Anda.
        # Jika file Anda bernama main.py, ubah metalensfinal.py menjadi main.py
        $match = Select-String -Path "metalensfinal.py" -Pattern 'CURRENT_VERSION = "(.*)"'
        $ver = $match.Matches.Groups[1].Value
        Write-Host "Detected Version: $ver"
        echo "version=$ver" >> $env:GITHUB_OUTPUT
    # ======================================

    - name: Ambil Path CustomTkinter Otomatis
      id: ctk-path
      shell: powershell
      run: |
        $ctk = python -c "import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))"
        echo "path=$ctk" >> $env:GITHUB_OUTPUT

    # === LANGKAH 2: BUILD EXE ===
    - name: Proses Mengubah Menjadi EXE
      run: |
        pyinstaller --onedir --console --name="NS_MetaRefiner_v${{ steps.get_version.outputs.version }}" --icon="logo.ico" --add-data "logo.ico;." --add-data "${{ steps.ctk-path.outputs.path }};customtkinter/" --hidden-import="customtkinter" --hidden-import="transformers" --hidden-import="iptcinfo3" --hidden-import="mutagen" --hidden-import="PIL._tkinter_finder" --hidden-import="keyring.backends.Windows" metalensfinal.py
        # PERHATIAN: Ganti 'metalensfinal.py' di akhir baris atas jika nama file Anda berbeda (misal: main.py)
    # ============================

    # === LANGKAH 3: MASUKKAN README BILINGUAL ===
    - name: Masukkan File Deskripsi (README.txt)
      shell: powershell
      run: |
        # Menyalin README.txt (yang tadi kita buat bilingual) ke dalam folder aplikasi
        Copy-Item -Path "README.txt" -Destination "dist/NS_MetaRefiner_v${{ steps.get_version.outputs.version }}/"
    # ============================================

    # === LANGKAH 4: UPLOAD ARTIFACT (TANPA ZIP GANDA) ===
    - name: Simpan Folder Aplikasi Ke GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NS-MetaRefiner-v${{ steps.get_version.outputs.version }}
        path: dist/NS_MetaRefiner_v${{ steps.get_version.outputs.version }}
        if-no-files-found: error
    # ===================================================
